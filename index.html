<!DOCTYPE html>
<html>
<head>
    <title>Ketamine Dose Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Ketamine Dose Calculator</h1>

    <p class="description">
        Convert between ketamine infusion rates.
    </p>

    <div class="input-group">
        <label for="weight">Patient weight (kg):</label>
        <input type="number" id="weight" min="0" step="0.1">
    </div>

    <hr>

    <h2>mg/hr &rarr; mcg/kg/min</h2>

    <div class="input-group">
        <label for="rate">Ketamine infusion (mg/hr):</label>
        <input type="number" id="rate" min="0" step="0.01">
    </div>

    <button onclick="calculateDose()">Calculate</button>

    <div class="result">
        <div class="result-label">
            Ketamine dose
        </div>

        <div id="result">
            -
        </div>
    </div>

    <hr>

    <h2>mcg/kg/min &rarr; mg/hr</h2>

    <div class="input-group">
        <label for="dose">Ketamine dose (mcg/kg/min):</label>
        <input type="number" id="dose" min="0" step="0.001">
    </div>

    <button onclick="calculateRate()">Calculate</button>

    <div class="result">
        <div class="result-label">
            Ketamine infusion
        </div>

        <div id="rateResult">
            -
        </div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
